<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DueDay Expo QR code</title>
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; }
      body { align-items: center; background: #f7f8fc; color: #1e2440; display: flex; justify-content: center; min-height: 100vh; margin: 0; }
      main { background: white; border: 1px solid #e5e7f0; border-radius: 24px; box-shadow: 0 16px 40px rgba(38, 49, 91, .12); max-width: 560px; padding: 28px; text-align: center; }
      h1 { margin: 0 0 10px; }
      p { color: #626a80; line-height: 1.5; }
      img { display: block; height: min(76vw, 420px); margin: 24px auto; width: min(76vw, 420px); }
      code { background: #f0efff; border-radius: 8px; color: #4b44c7; display: inline-block; font-size: 16px; padding: 9px 12px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Open DueDay in Expo Go</h1>
      <p>Scan this QR code with Expo Go while your phone and computer are on the same Wi-Fi.</p>
      <img src="https://quickchart.io/qr?size=600&amp;text=exp%3A%2F%2F192.168.4.46%3A8081" alt="QR code for DueDay Expo Go" />
      <p>Or open this link in Expo Go:</p>
      <code>exp://192.168.4.46:8081</code>
    </main>
  </body>
</html>
